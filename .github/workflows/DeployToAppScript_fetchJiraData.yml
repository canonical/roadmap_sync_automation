name: Deploy to Apps Script - fetch Jira Data

on:
  push:
    branches: [main]
    paths:
      - 'raw_jira_data/**'
      
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: '22'

    - name: Install clasp
      run: npm install -g @google/clasp

    - name: Set up clasp credentials
      run: echo '${{ secrets.CLASP_CREDENTIALS }}' > ~/.clasprc.json

    - name: Push to Apps Script
      run: |
        cd raw_jira_data
        clasp push
